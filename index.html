<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Моё расписание"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.svg"><link rel="stylesheet" href="style.css"><title>Моё расписание</title></head><body><div class="app">
<header class="top"><div><small>MY SCHEDULE</small><h1>Расписание</h1><p id="date"></p></div><button id="settings">⚙︎</button></header><main id="schedule"><div class="clock" id="clock">00:00</div><div class="days" id="days"></div><section class="next glass"><label>Сейчас / следующая пара</label><div class="nextrow"><div class="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="50"/><circle id="prog" cx="60" cy="60" r="50"/></svg><b id="timer">--:--</b><span id="caption">нет пары</span></div><div><em id="status">Сегодня</em><h2 id="subject">Пар больше нет</h2><p id="meta"></p></div></div></section><div class="listhead"><h2 id="dayname">Сегодня</h2><button onclick="alert('В недельном режиме будут показаны все дни.')">Вся неделя</button></div><div id="list"></div></main>
<section class="page" id="settingsPage"><h2>Настройки</h2><p>Персонализируй приложение.</p><button class="setting glass" id="themeBtn">🎨 <span><b>Оформление</b><small>Цвет, карточки и акцент</small></span>›</button><button class="setting glass" id="iconBtn">🖼️ <span><b>Иконка приложения</b><small>Выбор варианта</small></span>›</button><button class="setting glass" id="notifyBtn">🔔 <span><b>Уведомления</b><small>Напоминания о парах</small></span>›</button></section>
<nav><button class="active" data-page="schedule">◫<small>Расписание</small></button><button>✓<small>Задания</small></button><button>✎<small>Заметки</small></button><button data-page="settings">⚙<small>Настройки</small></button></nav>
<div class="modal" id="themeModal"><div class="modalbox"><header><h2>Оформление</h2><button data-close="themeModal">×</button></header><h3>Тема</h3><div class="themes" id="themes"></div><h3>Карточки</h3><div class="cards" id="cards"></div></div></div>
<div class="modal" id="iconModal"><div class="modalbox"><header><h2>Иконка</h2><button data-close="iconModal">×</button></header><p>Выбери вариант для приложения.</p><div class="icons" id="icons"></div></div></div>
<div class="modal" id="notifyModal"><div class="modalbox"><header><h2>Уведомления</h2><button data-close="notifyModal">×</button></header><label class="switch"><span>Уведомления о парах</span><input id="notify" type="checkbox"><i></i></label><label class="switch"><span>За 15 минут</span><input id="n15" type="checkbox" checked><i></i></label><label class="switch"><span>За 5 минут</span><input id="n5" type="checkbox" checked><i></i></label><button class="primary" id="test">Проверить уведомление</button><p>На iPhone сайт нужно добавить на экран «Домой» и разрешить уведомления.</p></div></div>
</div><script src="script.js"></script></body></html>
